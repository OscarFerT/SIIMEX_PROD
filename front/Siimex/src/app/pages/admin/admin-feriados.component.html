<div class="admin-feriados">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div>
      <h1 class="h4 mb-1 text-borgona"><i class="fas fa-calendar-xmark me-2"></i>Días feriados</h1>
      <p class="text-muted small mb-0">Estos feriados se excluyen en los cálculos de fechas de convocatoria y postulación.</p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <a routerLink="/admin/convocatorias" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i>Gestión modular
      </a>
      <button type="button" class="btn btn-borgona btn-sm" (click)="crear()">
        <i class="fas fa-plus me-1"></i>Nuevo feriado
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-borgona" role="status"></div>
    <p class="text-muted mt-2 mb-0">Cargando feriados...</p>
  </div>

  <div *ngIf="error" class="alert alert-danger">
    <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
  </div>

  <div *ngIf="!loading && !error" class="card shadow-sm border-0">
    <div class="card-body border-bottom">
      <input type="search" class="form-control form-control-sm" [(ngModel)]="filtro" placeholder="Buscar por fecha o nombre" />
    </div>
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Fecha</th>
            <th>Nombre</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let x of filtrados">
            <td class="small fw-semibold">{{ x.fecha }}</td>
            <td>{{ x.nombre }}</td>
            <td>
              <span class="badge" [class.bg-success]="x.activo" [class.bg-secondary]="!x.activo">
                {{ x.activo ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="text-end">
              <button type="button" class="btn btn-outline-primary btn-sm me-1" (click)="editar(x)">
                <i class="fas fa-edit"></i>
              </button>
              <button type="button" class="btn btn-outline-danger btn-sm" (click)="eliminar(x)">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div *ngIf="filtrados.length === 0" class="text-center py-5 text-muted">
      <i class="fas fa-calendar fa-2x mb-2 d-block opacity-50"></i>
      No hay feriados registrados.
    </div>
  </div>
</div>
