# Carga .env.properties desde la raíz del proyecto (Back/back-comecyt)
# Formato igual que .env: KEY=value. NO subir a Git.
spring.config.import=optional:file:./.env.properties
spring.application.name=demo
server.port=${SERVER_PORT}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY}
server.servlet.context-path=/api
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}




# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

#sprint.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect



# 256-bit key en Base64 (ejemplo). Genera una propia segura.
security.jwt.secret-base64=${JWT_SECRET_BASE64}

security.jwt.expiration-ms=${JWT_EXPIRATION_MS}


management.server.port=${MANAGEMENT_SERVER_PORT}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ============================================
# CONFIGURACIÓN DE LOGGING OPTIMIZADA
# ============================================
# SQL Logging: Solo mostrar consultas SQL formateadas (sin datos binarios)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=INFO
# Desactivar TRACE que imprime arrays de bytes (muy costoso)
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.orm.jdbc.extract=WARN
# Desactivar estadísticas de Hibernate (costoso en producción)
spring.jpa.properties.hibernate.generate_statistics=false

# Spring Security: Reducir verbosidad
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.web=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO

# Configuración de logs en archivo
logging.file.name=${LOG_FILE_NAME}
logging.file.max-size=${LOG_FILE_MAX_SIZE}
logging.file.max-history=${LOG_FILE_MAX_HISTORY}
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# LOGGING ESPECÍFICO POR PAQUETE
# ============================================
# Controladores y servicios: INFO (solo operaciones importantes)
# Cambiar a DEBUG solo cuando necesites depurar problemas específicos
logging.level.com.example.proyecto.demo.controller=INFO
logging.level.com.example.proyecto.demo.Service=INFO
logging.level.com.example.proyecto.demo.Repository=WARN

# Si necesitas depurar, descomenta estas líneas temporalmente:
# logging.level.com.example.proyecto.demo.controller.PerfilMigracionController=DEBUG
# logging.level.com.example.proyecto.demo.Service.PerfilCompletoService=DEBUG
# logging.level.com.example.proyecto.demo.controller.TrayectoriaController=DEBUG
# logging.level.com.example.proyecto.demo.Service.DocumentoService=DEBUG

# ============================================
# CONFIGURACIÓN DE ERRORES
# ============================================
# En producción, cambiar a "never" o "on_param" para seguridad
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never


# Límite de "parts" (cada campo de texto + cada archivo cuenta como 1 part)
server.tomcat.max-part-count=${SERVER_TOMCAT_MAX_PART_COUNT}

# (Recomendado) límites de tamaño
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}

# Directorio base para guardar archivos de usuarios
# Por defecto: carpeta "usuarios" en la raíz del proyecto
# Para PRODUCCIÓN: usar ruta absoluta externa, ej: /var/app/comecyt/usuarios
# O usar variable de entorno: app.upload.directory=/var/app/comecyt/usuarios
app.upload.directory=${APP_UPLOAD_DIRECTORY}

# Orígenes permitidos para CORS, separados por coma
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS}
app.security.hsts-max-age-seconds=${APP_SECURITY_HSTS_MAX_AGE_SECONDS}
app.security.content-security-policy=${APP_SECURITY_CONTENT_SECURITY_POLICY}
app.security.permissions-policy=${APP_SECURITY_PERMISSIONS_POLICY}

# ============================================
# MICROSOFT GRAPH - Verificación en dos pasos (2FA)
# ============================================
# AZURE_CLIENT_SECRET es obligatorio (variable de entorno). NUNCA lo pongas aquí.
azure.client-id=${AZURE_CLIENT_ID}
azure.tenant-id=${AZURE_TENANT_ID}
azure.client-secret=${AZURE_CLIENT_SECRET}
azure.token-url-template=${AZURE_TOKEN_URL_TEMPLATE}
azure.scope=${AZURE_SCOPE}
azure.send-mail-url-template=${AZURE_SEND_MAIL_URL_TEMPLATE}
# Buzón desde el cual enviar (debe existir en el tenant y tener Mail.Send otorgado)
azure.sender-email=${AZURE_SENDER_EMAIL}
# Guardar copia en elementos enviados del buzón emisor (útil para diagnóstico)
azure.save-to-sent-items=${AZURE_SAVE_TO_SENT_ITEMS}
# Asunto del correo 2FA (por defecto: "Código de verificación - SIIMEX COMECyT" con acentos correctos)
# Si lo defines aquí, usa Unicode para acentos: C\u00f3digo de verificaci\u00f3n
app.verification.email.subject=${VERIFICATION_EMAIL_SUBJECT:}
# URL del frontend para enlaces de verificación (ej. http://localhost:4200, https://comecyt.gob.mx)
app.frontend.url=${FRONTEND_URL}

# Folio de registro por modalidad (configurable)
app.registro.folio.prefix.investigador=${REGISTRO_FOLIO_PREFIX_INV}
app.registro.folio.prefix.innovador=${REGISTRO_FOLIO_PREFIX_IND}
app.registro.folio.prefix.hibrido=${REGISTRO_FOLIO_PREFIX_HIB}

# Correo donde se reciben los mensajes del formulario de contacto (por defecto usa azure.sender-email)
app.contact.recipient-email=${CONTACT_RECIPIENT_EMAIL:}
